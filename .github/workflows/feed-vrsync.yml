# Gera o XML dos portais (VRSync: Canal Pró / Grupo ZAP) de hora em hora e
# publica no GitHub Pages:
#
#   https://imobjazz-eng.github.io/jazz-xml/vrsync.xml
#
# COMO. Base: o XML VRSync completo que o próprio Vista gera para os portais
# (fotos, características, condomínio, IPTU). Sobre ele: sai quem a API do
# Vista não reconhece mais (a API é em tempo real; o arquivo do Vista, diário),
# sai quem tem menos de FEED_MIN_FOTOS fotos, e o total fica em FEED_MAXIMO,
# priorizando quem tem mais fotos. Ver gerador/espelho.mjs.
# Depois, enriquecimento (gerador/enriquecer.mjs): título e descrição limpos
# para o portal e coordenada para quem não tem, geocodificada no
# OpenStreetMap com cache (geocode.json, publicado ao lado do XML).
#
# POR QUE AQUI. O XML era montado na Supabase e congelou em 20/09/2026 com a
# restrição de cota da organização. Aqui não há banco no caminho, e
# repositório público deixa Pages e Actions gratuitos.
#
# SEGREDO (Settings → Secrets and variables → Actions):
#   VISTA_API_KEY   chave da API do Vista (sem ela, o filtro de ativos não roda)
# Variáveis opcionais (aba Variables): FEED_MINIMO (1000), FEED_MIN_FOTOS (7),
# FEED_MAXIMO (3000), VISTA_XML_URL.

name: Feed VRSync dos portais

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora, fora do minuto cheio
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: feed-vrsync
  cancel-in-progress: false

permissions:
  contents: write # para empurrar o branch gh-pages

jobs:
  testar:
    name: Testar gerador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: node gerador/teste.mjs

  publicar:
    name: Gerar e publicar
    needs: testar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Conferir o segredo
        env:
          VISTA_API_KEY: ${{ secrets.VISTA_API_KEY }}
        run: |
          if [ -z "$VISTA_API_KEY" ]; then
            echo "::warning::Sem VISTA_API_KEY: imóveis desativados no Vista só saem quando o Vista regenerar o próprio XML."
          fi

      # Cache da geocodificação: volta da última publicação, para cada endereço
      # ser consultado no OpenStreetMap uma vez só.
      - name: Recuperar cache de geocodificação
        run: |
          mkdir -p cache
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null && git show FETCH_HEAD:geocode.json > cache/geocode.json 2>/dev/null; then
            echo "Cache recuperado: $(wc -c < cache/geocode.json) bytes"
          else
            echo '{}' > cache/geocode.json
            echo "Sem cache anterior: começando vazio"
          fi

      - name: Gerar XML a partir do Vista
        env:
          GEOCODE_CACHE: cache/geocode.json
          GEO_LIMITE: ${{ vars.GEO_LIMITE || '200' }}
          VIDEOS_URL: ${{ vars.VIDEOS_URL }}
          VISTA_API_KEY: ${{ secrets.VISTA_API_KEY }}
          VISTA_XML_URL: ${{ vars.VISTA_XML_URL }}
          FEED_MINIMO: ${{ vars.FEED_MINIMO || '1000' }}
          FEED_MIN_FOTOS: ${{ vars.FEED_MIN_FOTOS || '7' }}
          FEED_MAXIMO: ${{ vars.FEED_MAXIMO || '3000' }}
        run: node gerador/gerar.mjs site/vrsync.xml

      # O runner do GitHub não traz o xmllint; o parser do Python já vem
      # instalado e acusa qualquer XML mal formado.
      - name: Validar XML
        run: python3 -c "import xml.etree.ElementTree as E, sys; r = E.parse(sys.argv[1]).getroot(); print('XML ok:', len(r.findall('.//{*}Listing')), 'anúncios')" site/vrsync.xml

      # Um commit só no gh-pages, sobrescrito a cada hora: o arquivo tem ~25 MB
      # e o histórico cresceria 600 MB por dia se cada geração virasse commit.
      # Se o gerador falhar acima, este passo não roda e o XML anterior fica
      # no ar: feed velho mantém anúncio; feed vazio derruba.
      - name: Publicar no GitHub Pages
        run: |
          cd site
          touch .nojekyll
          cat > index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Feed VRSync Jazz</title>
          <p>Feed dos portais: <a href="vrsync.xml">vrsync.xml</a></p>
          <p>Gerado em $(date -u +"%Y-%m-%d %H:%M UTC") pelo commit ${GITHUB_SHA::7}.</p>
          HTML
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed VRSync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Publicado: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/vrsync.xml" >> "$GITHUB_STEP_SUMMARY"
