<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Imóveis com telefone na tela — mudou de endereço</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://imobjazz-eng.github.io/jazz-conecta/oportunidades/" />
<script>
  // Link de acesso da equipe (…/oportunidades/#codigo=XXX). Este endereço e o
  // do Jazz Conecta são o mesmo site (imobjazz-eng.github.io), então o código
  // guardado aqui é o que a página de lá já lê ao abrir. O código vai no "#",
  // que não sai do navegador, e não segue no endereço de destino.
  var destino = "https://imobjazz-eng.github.io/jazz-conecta/oportunidades/";
  var codigo = new URLSearchParams(location.hash.slice(1)).get("codigo");
  if (codigo && codigo.trim()) {
    try { localStorage.setItem("jazz.codigo", codigo.trim()); } catch (e) { /* sem armazenamento */ }
    location.replace(destino + location.search);
  } else {
    location.replace(destino + location.search + location.hash);
  }
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://imobjazz-eng.github.io/jazz-conecta/oportunidades/" /></noscript>
</head>
<body style="font-family:sans-serif;padding:24px">
  A página mudou para <a href="https://imobjazz-eng.github.io/jazz-conecta/oportunidades/">imobjazz-eng.github.io/jazz-conecta/oportunidades/</a>.
</body>
</html>
